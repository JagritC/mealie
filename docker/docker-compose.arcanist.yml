# Arcanist E2E runtime override — stacks on top of docker-compose.yml +
# docker-compose.dev.yml. Switches the mealie app from the default
# DB_ENGINE=sqlite to Postgres so Arcanist sessions exercise the same
# database backend a real customer deployment uses.
#
# References the `postgres` service that's declared in docker-compose.dev.yml,
# adds a healthcheck so the mealie service can wait until Postgres is ready
# before booting (otherwise the mealie entrypoint racing the DB causes flaky
# first-boot behavior).
services:
  postgres:
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mealie -d mealie"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s

  mealie:
    environment:
      DB_ENGINE: postgres
      POSTGRES_USER: mealie
      POSTGRES_PASSWORD: mealie
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: mealie
    depends_on:
      postgres:
        condition: service_healthy
